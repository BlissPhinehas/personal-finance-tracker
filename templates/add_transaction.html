{% extends "base.html" %}

{% block title %}Add Transaction - FinanceFlow{% endblock %}
{% block page_title %}Add Transaction{% endblock %}

{% block content %}
<style>
    .form-container {
        max-width: 600px;
        margin: 0 auto;
    }

    .form-card {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 2rem;
        border: 1px solid var(--border-color);
    }

    .form-grid {
        display: grid;
        gap: 1.5rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-label {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .form-input,
    .form-select {
        width: 100%;
        padding: 0.875rem 1rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        color: var(--text-primary);
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .form-input:focus,
    .form-select:focus {
        outline: none;
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 3px rgba(77, 124, 254, 0.1);
    }

    .form-input::placeholder {
        color: var(--text-muted);
    }

    .form-actions {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
    }

    .btn-full {
        flex: 1;
    }

    .recurring-section {
        background: var(--bg-secondary);
        padding: 1.5rem;
        border-radius: 12px;
        border: 1px solid var(--border-color);
    }

    .checkbox-wrapper {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
    }

    .checkbox {
        width: 20px;
        height: 20px;
        cursor: pointer;
    }

    .checkbox-label {
        font-weight: 500;
        color: var(--text-secondary);
        cursor: pointer;
    }

    .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
    }

    @media (max-width: 768px) {
        .grid-2 {
            grid-template-columns: 1fr;
        }

        .form-actions {
            flex-direction: column;
        }
    }
</style>

<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/bold/style.css">

<div class="form-container">
    <div class="form-card">
        <form method="POST">
            <div class="form-grid">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-input" id="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label for="amount" class="form-label">Amount</label>
                        <input type="number" step="0.01" class="form-input" id="amount" name="amount" placeholder="0.00"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description" class="form-label">Description</label>
                    <input type="text" class="form-input" id="description" name="description"
                        placeholder="Enter transaction description" required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="type" class="form-label">Type</label>
                        <select class="form-select" id="type" name="type" required>
                            <option value="">Select type</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="">Select category</option>
                            <option value="Food">Food & Drinks</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills & Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Education">Education</option>
                            <option value="Salary">Salary</option>
                            <option value="Investment">Investment</option>
                            <option value="Savings">Savings</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="recurring-section">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" class="checkbox" id="is_recurring" name="is_recurring"
                            onchange="toggleRecurring()">
                        <label for="is_recurring" class="checkbox-label">Recurring Transaction</label>
                    </div>

                    <div class="form-group" id="recurring_options" style="display: none;">
                        <label for="recurring_frequency" class="form-label">Frequency</label>
                        <select class="form-select" id="recurring_frequency" name="recurring_frequency">
                            <option value="">Select frequency</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                            <option value="quarterly">Quarterly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-full">Add Transaction</button>
                <a href="/" class="btn btn-secondary btn-full">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
    // Set today's date as default
    document.getElementById('date').valueAsDate = new Date();
    document.getElementById('date').setAttribute('max', new Date().toISOString().split('T')[0]);

    function toggleRecurring() {
        const checkbox = document.getElementById('is_recurring');
        const options = document.getElementById('recurring_options');
        const frequency = document.getElementById('recurring_frequency');

        if (checkbox.checked) {
            options.style.display = 'block';
            frequency.required = true;
        } else {
            options.style.display = 'none';
            frequency.required = false;
            frequency.value = '';
        }
    }
</script>
{% endblock %}
