{% extends "base.html" %}

{% block title %}Edit Transaction - FinanceFlow{% endblock %}
{% block page_title %}Edit Transaction{% endblock %}

{% block content %}
<style>
    .form-container {
        max-width: 600px;
        margin: 0 auto;
    }

    .form-card {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 2rem;
        border: 1px solid var(--border-color);
    }

    .form-grid {
        display: grid;
        gap: 1.5rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-label {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .form-input,
    .form-select {
        width: 100%;
        padding: 0.875rem 1rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        color: var(--text-primary);
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .form-input:focus,
    .form-select:focus {
        outline: none;
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 3px rgba(77, 124, 254, 0.1);
    }

    .form-actions {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
    }

    .btn-full {
        flex: 1;
    }

    .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
    }

    @media (max-width: 768px) {
        .grid-2 {
            grid-template-columns: 1fr;
        }
        
        .form-actions {
            flex-direction: column;
        }
    }
</style>

<div class="form-container">
    <div class="form-card">
        <form method="POST">
            <div class="form-grid">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" 
                               class="form-input" 
                               id="date" 
                               name="date"
                               value="{{ transaction[2] if USE_POSTGRES else transaction[2] }}"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="amount" class="form-label">Amount</label>
                        <input type="number" 
                               step="0.01" 
                               class="form-input" 
                               id="amount" 
                               name="amount"
                               value="{{ transaction[4] if USE_POSTGRES else transaction[4] }}"
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description" class="form-label">Description</label>
                    <input type="text" 
                           class="form-input" 
                           id="description" 
                           name="description"
                           value="{{ transaction[3] if USE_POSTGRES else transaction[3] }}"
                           required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="type" class="form-label">Type</label>
                        <select class="form-select" id="type" name="type" required>
                            <option value="income" {% if (transaction[6] if USE_POSTGRES else transaction[6]) == 'income' %}selected{% endif %}>Income</option>
                            <option value="expense" {% if (transaction[6] if USE_POSTGRES else transaction[6]) == 'expense' %}selected{% endif %}>Expense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" name="category" required>
                            {% set current_category = transaction[5] if USE_POSTGRES else transaction[5] %}
                            <option value="Food" {% if current_category == 'Food' %}selected{% endif %}>Food & Drinks</option>
                            <option value="Transportation" {% if current_category == 'Transportation' %}selected{% endif %}>Transportation</option>
                            <option value="Shopping" {% if current_category == 'Shopping' %}selected{% endif %}>Shopping</option>
                            <option value="Bills" {% if current_category == 'Bills' %}selected{% endif %}>Bills & Utilities</option>
                            <option value="Entertainment" {% if current_category == 'Entertainment' %}selected{% endif %}>Entertainment</option>
                            <option value="Healthcare" {% if current_category == 'Healthcare' %}selected{% endif %}>Healthcare</option>
                            <option value="Education" {% if current_category == 'Education' %}selected{% endif %}>Education</option>
                            <option value="Salary" {% if current_category == 'Salary' %}selected{% endif %}>Salary</option>
                            <option value="Investment" {% if current_category == 'Investment' %}selected{% endif %}>Investment</option>
                            <option value="Savings" {% if current_category == 'Savings' %}selected{% endif %}>Savings</option>
                            <option value="Other" {% if current_category == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-full">Update Transaction</button>
                <a href="/" class="btn btn-secondary btn-full">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
